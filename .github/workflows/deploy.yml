name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: surgeon
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: surgeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U surgeon -d surgeon"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://surgeon:ci-only-password@localhost:5432/surgeon
      APP_URL: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-123
      LOCAL_STORAGE_DIR: /tmp/surgeon-test-storage
      DEV_MAIL_DIR: /tmp/surgeon-test-mail
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare test database
        run: npm run db:migrate && npm run db:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
